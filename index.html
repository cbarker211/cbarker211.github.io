<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Industry Emissions Tracker</title>

    <script>
        (function () {
            var t = localStorage.getItem('oe-theme');
            if (t !== 'light' && t !== 'dark') {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon_rocket.ico">

    <link rel="preload" as="image" href="assets/images/esa_launch.jpg">
    <link rel="preload" as="image" href="assets/images/esa_reentry.jpg">

    <link rel="canonical" href="https://orbitalemissions.org">
	<meta property="og:url" content="https://orbitalemissions.org">
	
	<meta property="og:type" content="website">
	<meta property="og:title" content="Space Industry Emissions Tracker">
	<meta property="og:description" content="Explore global rocket launch and re-entry emissions from 1957 to 2025. Filter, download, and visualise the data.">
	<meta property="og:image" content="https://orbitalemissions.org/assets/images/og-index.png">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="description" content="Explore global rocket launch and re-entry emissions from 1957 to 2025. Filter, download, and visualise the data.">

    <style>
        .landing-page {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: var(--color-bg);
        }

        .buttons {
            position: absolute;
            z-index: 2;
            display: flex;
            gap: 40px;
        }

        .btn {
            padding: 20px;
            width: 200px;
            font-size: 2em;
            text-decoration: none;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            transition: all 0.5s ease;
            background-color: #246a99;
            border-color: transparent;
            box-shadow: inset 0 0 0 0 transparent, 0 0 0 0 transparent, inset 0 0 0 0 transparent, 0 0.3rem 0 0 #143d59;
        }

        .btn:hover {
            background-color: #588db1;
            transform: scale(1.1);
            cursor: pointer;
            font-weight: bold;
        }

        .images-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
        }

        .image-panel {
            flex: 1;
            height: 100%;
            background-size: auto 100%;
            background-position: center;
            background-repeat: no-repeat;
            transition: flex 0.5s ease;
            filter: blur(4px);
        }

        @media (max-width: 480px) {
            .buttons {
                flex-direction: column;
                gap: 20px;
            }

            .btn {
                width: 160px;
                padding: 14px;
                font-size: 1.3em;
            }
        }
    </style>
</head>

<body>

    <div class="landing-page">
        <button id="themeToggle" type="button" class="theme-toggle theme-toggle-standalone" aria-pressed="false" aria-label="Switch to light mode">
            <span class="theme-toggle-icon" aria-hidden="true">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </span>
        </button>
        <div class="buttons">
            <a href="launches.html" class="btn" id="launch-btn">Launch</a>
            <a href="reentries.html" class="btn" id="reentry-btn">Re-entry</a>
        </div>
    <div class="images-container">
        <div class="image-panel" id="launch-panel"></div>
        <div class="image-panel" id="reentry-panel"></div>
    </div>
  </div>

  <div class="bottom-row">
    <p style="text-align: left; margin: 0;">
        Images: ESA/David Ducross, ESA/SpaceX. 
    </p>
  </div>

  <script src="js/index.js"></script>
  <script defer src="js/theme.js"></script>

</body>
</html>
